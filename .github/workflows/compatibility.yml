name: Platform compatibility
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # 测试挂起(事件循环不排空)不会自然结束;没有超时会一直占着 runner,
    # 让整个矩阵迟迟给不出结论。正常一轮在 2 分钟内完成。
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      # 打包预检:只校验输入与平台信息,不写文件;关闭「发布脚本只有本地能跑」的盲区。
      - run: node scripts/build-release.mjs --dry-run
      - run: npm test
      # 覆盖率:不阻断测试,只在 ubuntu 产出报告。
      - if: matrix.os == 'ubuntu-latest'
        run: npm run coverage

  # 桌面壳启动冒烟:真实拉起 Electron -> 服务 -> 窗口 loadURL,面板加载成功即退出。
  # 已在 main 上连续两次通过(2026-11-06),从观察模式转为硬门禁。
  desktop-smoke:
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      # GitHub-hosted runner 偶发无法下载 Electron release；本地手动 smoke 仍为硬失败。
      ELECTRON_SMOKE_OPTIONAL: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/electron-smoke.mjs
