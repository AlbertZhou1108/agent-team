name: Release artifacts

# 只构建并上传 Actions 产物，不创建 GitHub Release。
# 发布仍需人工下载产物、创建 Release 并上传，避免自动对外发布。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm test
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          node -e "const version = require('./package.json').version; const tag = process.env.GITHUB_REF_NAME; if (tag !== 'v' + version) { console.error('tag ' + tag + ' does not match package version v' + version); process.exit(1); }"
      - run: npm run package
      - name: Archive (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          PLATFORM="$(node -p 'process.platform')"
          ARCH="$(node -p 'process.arch')"
          DIR="dist/agent-team-${PLATFORM}-${ARCH}"
          NAME="agent-team-v${VERSION}-${PLATFORM}-${ARCH}"
          mv "${DIR}" "dist/${NAME}"
          tar -czf "dist/${NAME}.tar.gz" -C dist "${NAME}"
          (cd dist && shasum -a 256 "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256")
      - name: Archive (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $platform = node -p "process.platform"
          $arch = node -p "process.arch"
          $dir = "dist/agent-team-$platform-$arch"
          $name = "agent-team-v$version-$platform-$arch"
          Move-Item $dir "dist/$name"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          $hash = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -FilePath "dist/$name.zip.sha256" -Encoding ascii
      - name: Upload artifacts (unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: agent-team-${{ matrix.os }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Upload artifacts (windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: agent-team-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error
          retention-days: 30
