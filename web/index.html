<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent Team · 观测</title><link rel="stylesheet" href="/style.css"></head>
<body><aside><div class="brand">◈ Agent Team</div><div class="sub">本机协作 · 只读观测</div><h2>群</h2><nav id="groups"></nav><div class="foot">用户与主 Agent 在 CLI 聊天。<br>这里展示群记录与宿主事件。</div></aside>
<main><header><div><div class="sub">CONVERSATIONS</div><h1 id="title">选择一个群</h1></div><span id="connection">连接中</span></header><div id="error" role="alert"></div><section id="members"></section><section class="columns"><div class="messages"><div class="section-title"><h2>消息记录</h2><select id="pair" aria-label="按双人对话过滤"><option value="">全部对话</option></select></div><div id="messages"></div><button id="more">加载后续消息</button></div><div class="sessions"><h2>宿主会话</h2><p class="sub">群内独立上下文；不展示用户私聊。</p><div id="sessions"></div><div id="models"></div><div id="history"></div></div></section></main><script type="module" src="/app.js"></script></body></html>
