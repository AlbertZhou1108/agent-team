<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PROTOTYPE · Panel Agent 生命周期</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --border: #dfe3e8;
      --text: #1f2937;
      --muted: #667085;
      --accent: #2563eb;
      --accent-soft: #eaf1ff;
      --ok: #147a55;
      --ok-soft: #e9f8f1;
      --warn: #a15c00;
      --warn-soft: #fff6e5;
      --danger: #b42318;
      --danger-soft: #fff0ee;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body::before {
      content: "PROTOTYPE · 仅用于验证，不写入真实数据";
      display: block;
      padding: 7px;
      background: #fff1c2;
      color: #744d00;
      text-align: center;
      font-size: 11px;
      letter-spacing: .08em;
    }
    main {
      width: min(1180px, calc(100% - 32px));
      margin: 24px auto 64px;
    }
    header { margin-bottom: 20px; }
    h1 { margin: 0; font-size: 26px; }
    h2 { margin: 0 0 14px; font-size: 16px; }
    h3 { margin: 0 0 8px; font-size: 14px; }
    p { margin: 0; }
    .lead { margin-top: 8px; max-width: 850px; color: var(--muted); }
    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1.3fr) minmax(320px, .7fr);
      gap: 16px;
    }
    .panel {
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel);
      padding: 18px;
    }
    .summary {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }
    .metric { border: 1px solid var(--border); border-radius: 9px; padding: 10px 12px; }
    .metric strong { display: block; font-size: 18px; }
    .metric span { color: var(--muted); font-size: 11px; }
    .context {
      margin-bottom: 16px;
      border-radius: 9px;
      background: var(--accent-soft);
      padding: 10px 12px;
      color: #19459f;
    }
    .team-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .team {
      position: relative;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
    }
    .team.active { border-color: var(--accent); background: var(--accent-soft); }
    .team-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .team-meta { margin-top: 8px; color: var(--muted); font-size: 12px; }
    .pill {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 10px;
      font-weight: 650;
    }
    .observer { background: #eef1f4; color: #475467; }
    .main { background: var(--ok-soft); color: var(--ok); }
    .busy { background: var(--warn-soft); color: var(--warn); }
    .prep {
      margin-top: 14px;
      border: 1px dashed var(--border);
      border-radius: 9px;
      padding: 12px;
    }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
    button {
      appearance: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      padding: 8px 11px;
      font: inherit;
      font-weight: 550;
      cursor: pointer;
    }
    button:hover { border-color: #aeb7c2; background: #f9fafb; }
    button.primary { border-color: var(--accent); background: var(--accent); color: white; }
    button.primary:hover { background: #1d4ed8; }
    .message {
      min-height: 46px;
      margin-bottom: 14px;
      border-radius: 8px;
      padding: 10px 12px;
      background: #eef1f4;
    }
    .message.ok { background: var(--ok-soft); color: var(--ok); }
    .message.blocked { background: var(--danger-soft); color: var(--danger); }
    .log {
      display: flex;
      flex-direction: column;
      gap: 7px;
      max-height: 230px;
      overflow: auto;
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .log li { border-bottom: 1px solid #edf0f3; padding-bottom: 7px; font-size: 12px; }
    .log time { display: block; color: var(--muted); font: 10px ui-monospace, monospace; }
    .scenario-panel { margin-top: 16px; }
    .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
    .tabs button.active { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
    .scenario-copy { margin-bottom: 12px; color: var(--muted); }
    .step { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
    .step strong { display: block; }
    .step small { color: var(--muted); }
    code { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; }
    @media (max-width: 840px) {
      .layout { grid-template-columns: 1fr; }
      .summary, .team-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Panel Agent 生命周期验证</h1>
      <p class="lead">
        验证问题：在“每个数据目录一个 Panel Agent、一条全局私人会话、多个团队关系”的模型下，
        观察状态、主 Agent 接管交还、准备流程和跨团队上下文能否保持边界清晰。
      </p>
    </header>

    <div class="layout">
      <section class="panel" aria-live="polite">
        <h2>当前状态</h2>
        <div class="summary" id="summary"></div>
        <div class="context" id="context"></div>
        <div class="team-grid" id="teams"></div>
        <div id="preparation"></div>
      </section>

      <aside class="panel">
        <h2>操作与最近变化</h2>
        <div class="message" id="message">选择自由操作或下方引导场景。</div>
        <div class="actions" id="actions"></div>
        <h3 style="margin-top:20px">事件记录</h3>
        <ol class="log" id="log"></ol>
      </aside>
    </div>

    <section class="panel scenario-panel">
      <h2>引导场景</h2>
      <div class="tabs" id="tabs"></div>
      <p class="scenario-copy" id="scenario-copy"></p>
      <div class="step">
        <div>
          <strong id="step-title"></strong>
          <small id="step-hint"></small>
        </div>
        <button class="primary" id="step-button"></button>
      </div>
    </section>
  </main>

  <script>
    // Pure state machine: no DOM access in this block.
    const PanelAgentLogic = (() => {
      const clone = value => JSON.parse(JSON.stringify(value));
      const createInitialState = () => ({
        panelAgent: null,
        conversation: { id: 'global-private', activeTeamId: null, turns: 0, lastPrompt: null },
        teams: {
          'team-a': {
            id: 'team-a',
            name: '开发验收',
            relation: 'observer',
            busy: false,
            pendingMessages: 0,
            originalLeadPaused: false,
          },
          'team-b': {
            id: 'team-b',
            name: '多角色圆桌',
            relation: 'observer',
            busy: false,
            pendingMessages: 0,
            originalLeadPaused: false,
          },
        },
        preparation: null,
        log: [],
      });

      function finish(state, message, tone = 'ok') {
        state.log.unshift({ at: new Date().toISOString(), message, tone });
        state.log = state.log.slice(0, 30);
        return { state, message, tone };
      }

      function blocked(state, message) {
        return finish(state, message, 'blocked');
      }

      function selectedTeam(state) {
        return state.teams[state.conversation.activeTeamId] ?? null;
      }

      function reduce(current, action) {
        const state = clone(current);
        if (action.type === 'reset') return finish(createInitialState(), '已重置为“无 Panel Agent”的初始状态。', 'ok');
        if (action.type === 'create_agent') {
          if (state.panelAgent) return blocked(state, '当前数据目录已经存在 Panel Agent。');
          state.panelAgent = {
            id: 'panel-agent',
            name: 'Panel Agent',
            host: 'dsh',
            model: 'deepseek-flash',
            effort: 'low',
          };
          return finish(state, 'Panel Agent 已惰性创建；两个已有团队自动进入观察状态。');
        }
        if (!state.panelAgent) return blocked(state, '请先创建 Panel Agent。');
        if (action.type === 'select_global') {
          state.conversation.activeTeamId = null;
          return finish(state, '当前上下文切换为全局私人会话。');
        }
        if (action.type === 'select_team') {
          if (!state.teams[action.teamId]) return blocked(state, '团队不存在。');
          state.conversation.activeTeamId = action.teamId;
          return finish(state, `当前上下文切换为团队：${state.teams[action.teamId].name}。`);
        }
        if (action.type === 'toggle_busy') {
          const team = selectedTeam(state);
          if (!team) return blocked(state, '先选择一个团队上下文。');
          team.busy = !team.busy;
          return finish(state, `${team.name}${team.busy ? '现在有运行中回合' : '已经空闲'}。`, team.busy ? 'warn' : 'ok');
        }
        if (action.type === 'attempt_write') {
          const team = selectedTeam(state);
          if (!team) return blocked(state, '团队写操作必须显式选择团队。');
          if (team.relation !== 'main') return blocked(state, `已阻止越权：${team.name} 当前只有观察权限。`);
          if (team.busy) return blocked(state, `已阻止：${team.name} 的 coordination 正在运行，本团队应串行执行。`);
          return finish(state, `允许写入 ${team.name}；工具信封必须携带 teamId=${team.id}。`);
        }
        if (action.type === 'start_preparation') {
          if (state.preparation && state.preparation.status !== 'created') return blocked(state, '已有未结束的团队准备草案。');
          state.preparation = { id: 'prep-1', revision: 0, hash: null, status: 'draft', approved: false };
          return finish(state, '已进入团队准备状态；这仍是私人会话中的过渡生命周期。');
        }
        if (action.type === 'propose_contract') {
          if (!state.preparation || state.preparation.status !== 'draft') return blocked(state, '当前没有可更新的准备草案。');
          state.preparation.revision += 1;
          state.preparation.hash = `hash-r${state.preparation.revision}`;
          state.preparation.approved = false;
          return finish(state, `已生成契约 revision ${state.preparation.revision}，等待用户确认。`);
        }
        if (action.type === 'approve_preparation') {
          if (!state.preparation || state.preparation.status !== 'draft' || !state.preparation.hash) {
            return blocked(state, '没有可批准的契约版本。');
          }
          if (action.revision !== state.preparation.revision || action.hash !== state.preparation.hash) {
            return blocked(state, '批准失败：revision/hash 与当前草案不匹配。');
          }
          state.preparation.approved = true;
          return finish(state, `用户已批准 revision ${action.revision}；Panel Agent 只能执行这一个版本。`);
        }
        if (action.type === 'materialize_team') {
          if (!state.preparation?.approved) return blocked(state, '草案未获用户批准，不能创建团队。');
          state.teams['team-c'] = {
            id: 'team-c',
            name: '新团队',
            relation: 'main',
            busy: false,
            pendingMessages: 0,
            originalLeadPaused: false,
          };
          state.preparation.status = 'created';
          state.conversation.activeTeamId = 'team-c';
          return finish(state, '团队创建完成；Panel Agent 自动成为主 Agent，并获得独立 coordination 上下文。');
        }
        if (action.type === 'takeover') {
          const team = selectedTeam(state);
          if (!team) return blocked(state, '先选择一个团队上下文。');
          if (team.relation === 'main') return blocked(state, 'Panel Agent 已是该团队主 Agent。');
          if (team.busy) return blocked(state, `接管被拒绝：${team.name} 仍有运行中回合。`);
          if (team.pendingMessages) return blocked(state, `接管被拒绝：${team.name} 仍有未处理正式消息。`);
          team.relation = 'main';
          team.originalLeadPaused = true;
          return finish(state, `Panel Agent 已接管 ${team.name}；原主 Agent 身份和历史暂停保留。`);
        }
        if (action.type === 'handback') {
          const team = selectedTeam(state);
          if (!team) return blocked(state, '先选择一个团队上下文。');
          if (team.relation !== 'main') return blocked(state, '当前不是主 Agent，无法交还。');
          if (team.busy) return blocked(state, `交还被拒绝：${team.name} 仍有运行中回合。`);
          team.relation = 'observer';
          team.originalLeadPaused = false;
          return finish(state, `已交还 ${team.name}；原主 Agent 恢复，Panel Agent 回到观察状态。`);
        }
        if (action.type === 'send_private') {
          state.conversation.turns += 1;
          state.conversation.lastPrompt = action.text;
          const team = selectedTeam(state);
          return finish(
            state,
            team
              ? `私人对话已记录，团队上下文为 ${team.id}；不会自动发送给团队。`
              : '私人对话已记录；没有附加团队上下文。',
          );
        }
        return blocked(state, `未知操作：${action.type}`);
      }

      return { createInitialState, reduce };
    })();
  </script>

  <script>
    let state = PanelAgentLogic.createInitialState();
    let message = { text: '选择自由操作或下方引导场景。', tone: '' };
    let activeScenario = 'create';
    let scenarioStep = 0;

    const scenarios = {
      create: {
        title: '从无到有',
        description: '验证惰性创建，以及观察状态下不能直接控制团队。',
        steps: [
          ['创建 Panel Agent', '创建后检查两个已有团队是否自动成为观察关系。', { type: 'create_agent' }],
          ['选择开发验收', '将全局私人会话附加到团队 A 的上下文。', { type: 'select_team', teamId: 'team-a' }],
          ['尝试团队写操作', '观察状态必须被框架阻止。', { type: 'attempt_write' }],
        ],
      },
      preparation: {
        title: '创建团队',
        description: '验证准备是生命周期状态，并确保未批准或过期版本不能创建团队。',
        steps: [
          ['创建 Panel Agent', '先建立全局 Agent。', { type: 'create_agent' }],
          ['开始准备', '进入准备状态，但尚未产生团队。', { type: 'start_preparation' }],
          ['生成契约 revision 1', 'Agent 只能提出草案。', { type: 'propose_contract' }],
          ['批准 revision 1', '模拟用户点击“批准此版本”。', { type: 'approve_preparation', revision: 1, hash: 'hash-r1' }],
          ['创建团队', '创建后 Panel Agent 成为主 Agent。', { type: 'materialize_team' }],
        ],
      },
      takeover: {
        title: '接管与交还',
        description: '验证运行中不能接管，交还后 Panel Agent 默认恢复观察关系。',
        steps: [
          ['创建 Panel Agent', '建立全局身份。', { type: 'create_agent' }],
          ['选择开发验收', '准备接管已有团队。', { type: 'select_team', teamId: 'team-a' }],
          ['制造运行中回合', '设置团队为忙碌。', { type: 'toggle_busy' }],
          ['尝试接管', '必须因团队仍在运行而失败。', { type: 'takeover' }],
          ['结束运行', '清空运行状态。', { type: 'toggle_busy' }],
          ['接管团队', '安全状态下接管成功。', { type: 'takeover' }],
          ['交还团队', '原主 Agent 恢复，Panel Agent 回到观察。', { type: 'handback' }],
        ],
      },
      isolation: {
        title: '多团队隔离',
        description: '验证同一 Panel Agent 可以主控多个团队，但上下文和并发锁彼此独立。',
        steps: [
          ['创建 Panel Agent', '建立全局身份。', { type: 'create_agent' }],
          ['选择开发验收', '切到团队 A。', { type: 'select_team', teamId: 'team-a' }],
          ['接管开发验收', '团队 A 进入主控。', { type: 'takeover' }],
          ['选择多角色圆桌', '切到团队 B。', { type: 'select_team', teamId: 'team-b' }],
          ['接管多角色圆桌', '团队 B 也进入主控。', { type: 'takeover' }],
          ['在团队 B 写入', '确认操作只带团队 B 的 teamId。', { type: 'attempt_write' }],
          ['切回团队 A', '上下文随团队显式切换。', { type: 'select_team', teamId: 'team-a' }],
          ['在团队 A 写入', '确认没有复用团队 B 的上下文。', { type: 'attempt_write' }],
        ],
      },
    };

    const freeActions = [
      ['创建 Panel Agent', 'primary', { type: 'create_agent' }],
      ['全局会话', '', { type: 'select_global' }],
      ['选择开发验收', '', { type: 'select_team', teamId: 'team-a' }],
      ['选择多角色圆桌', '', { type: 'select_team', teamId: 'team-b' }],
      ['切换运行状态', '', { type: 'toggle_busy' }],
      ['尝试团队写入', '', { type: 'attempt_write' }],
      ['开始准备', '', { type: 'start_preparation' }],
      ['生成契约草案', '', { type: 'propose_contract' }],
      ['批准当前草案', '', () => state.preparation
        ? { type: 'approve_preparation', revision: state.preparation.revision, hash: state.preparation.hash }
        : { type: 'approve_preparation', revision: -1, hash: 'missing' }],
      ['创建已批准团队', '', { type: 'materialize_team' }],
      ['接管当前团队', '', { type: 'takeover' }],
      ['交还当前团队', '', { type: 'handback' }],
      ['发送私人消息', '', { type: 'send_private', text: '解释当前团队状态' }],
      ['重置全部', '', { type: 'reset' }],
    ];

    const escapeHtml = value => String(value).replace(/[&<>"']/g, char => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    })[char]);

    function apply(action) {
      const result = PanelAgentLogic.reduce(state, action);
      state = result.state;
      message = { text: result.message, tone: result.tone };
      render();
    }

    function renderTeams() {
      return Object.values(state.teams).map(team => `
        <article class="team ${state.conversation.activeTeamId === team.id ? 'active' : ''}">
          <div class="team-head">
            <strong>${escapeHtml(team.name)}</strong>
            <span class="pill ${team.relation}">${team.relation === 'main' ? '主 Agent' : '观察'}</span>
          </div>
          <p class="team-meta"><code>${team.id}</code></p>
          <p class="team-meta">
            ${team.busy ? '<span class="pill busy">运行中</span>' : '空闲'}
            ${team.originalLeadPaused ? ' · 原主 Agent 已暂停' : ''}
          </p>
        </article>
      `).join('');
    }

    function renderPreparation() {
      if (!state.preparation) return '';
      const prep = state.preparation;
      return `
        <div class="prep">
          <strong>团队准备 · ${escapeHtml(prep.status)}</strong>
          <p class="team-meta">revision ${prep.revision} · ${escapeHtml(prep.hash || '尚未生成契约')}</p>
          <p class="team-meta">${prep.approved ? '用户已批准当前版本' : '仍在等待用户确认'}</p>
        </div>
      `;
    }

    function renderActions() {
      return freeActions.map(([label, className, action], index) => (
        `<button data-free-action="${index}" class="${className}">${label}</button>`
      )).join('');
    }

    function renderScenario() {
      const scenario = scenarios[activeScenario];
      document.getElementById('tabs').innerHTML = Object.entries(scenarios).map(([key, item]) => (
        `<button data-scenario="${key}" class="${key === activeScenario ? 'active' : ''}">${item.title}</button>`
      )).join('');
      document.getElementById('scenario-copy').textContent = scenario.description;
      const step = scenario.steps[scenarioStep];
      if (!step) {
        document.getElementById('step-title').textContent = '场景已完成';
        document.getElementById('step-hint').textContent = '可以继续自由操作，或切换到其他场景。';
        document.getElementById('step-button').textContent = '重新开始';
        document.getElementById('step-button').dataset.step = 'restart';
        return;
      }
      document.getElementById('step-title').textContent = step[0];
      document.getElementById('step-hint').textContent = step[1];
      document.getElementById('step-button').textContent = `执行第 ${scenarioStep + 1} 步`;
      document.getElementById('step-button').dataset.step = 'next';
    }

    function render() {
      const agent = state.panelAgent;
      document.getElementById('summary').innerHTML = `
        <div class="metric"><strong>${agent ? '已创建' : '未创建'}</strong><span>Panel Agent</span></div>
        <div class="metric"><strong>${Object.keys(state.teams).length}</strong><span>团队关系</span></div>
        <div class="metric"><strong>${state.conversation.turns}</strong><span>全局私人消息</span></div>
      `;
      const activeTeam = state.teams[state.conversation.activeTeamId];
      document.getElementById('context').innerHTML = activeTeam
        ? `全局私人会话 · 当前上下文：<strong>${escapeHtml(activeTeam.name)}</strong> (${activeTeam.id})`
        : '全局私人会话 · 当前没有附加团队上下文';
      document.getElementById('teams').innerHTML = renderTeams();
      document.getElementById('preparation').innerHTML = renderPreparation();
      document.getElementById('message').className = `message ${message.tone}`;
      document.getElementById('message').textContent = message.text;
      document.getElementById('actions').innerHTML = renderActions();
      document.getElementById('log').innerHTML = state.log.map(item => `
        <li><time>${escapeHtml(new Date(item.at).toLocaleTimeString('zh-CN'))}</time>${escapeHtml(item.message)}</li>
      `).join('');
      renderScenario();
    }

    document.addEventListener('click', event => {
      const freeButton = event.target.closest('[data-free-action]');
      if (freeButton) {
        const [, , action] = freeActions[Number(freeButton.dataset.freeAction)];
        apply(typeof action === 'function' ? action() : action);
        return;
      }
      const scenarioButton = event.target.closest('[data-scenario]');
      if (scenarioButton) {
        activeScenario = scenarioButton.dataset.scenario;
        scenarioStep = 0;
        state = PanelAgentLogic.createInitialState();
        message = { text: `已切换到“${scenarios[activeScenario].title}”场景。`, tone: '' };
        render();
        return;
      }
      const stepButton = event.target.closest('[data-step]');
      if (stepButton) {
        if (stepButton.dataset.step === 'restart') {
          state = PanelAgentLogic.createInitialState();
          scenarioStep = 0;
          message = { text: '场景已重新开始。', tone: '' };
        } else {
          const step = scenarios[activeScenario].steps[scenarioStep];
          const result = PanelAgentLogic.reduce(state, step[2]);
          state = result.state;
          message = { text: result.message, tone: result.tone };
          scenarioStep += 1;
        }
        render();
      }
    });

    render();
  </script>
</body>
</html>
